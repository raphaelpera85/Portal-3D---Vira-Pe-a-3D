name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: 3.10.13
      - run: python -m unittest discover -s spaces/triposr -p 'test_*.py'
      - run: npm run test:e2e
      - run: npm run build
